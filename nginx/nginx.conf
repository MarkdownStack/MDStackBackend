worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 65;

    upstream fastapi_app {
        server backend:5000;
    }

    # The MCP server (mcp_server/) talks Streamable HTTP, not plain
    # request/response — a client can hold a connection open for a
    # long-lived SSE stream. server.py binds this internally on 8090 (see
    # MDSTACK_MCP_PORT in docker-compose.yml).
    upstream mcp_app {
        server mcp:8090;
    }

    server {
        listen 80;
        server_name api.stalk-my-money.in;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name api.stalk-my-money.in;

        ssl_certificate /etc/ssl/certs/tm_keys/certificate.crt;
        ssl_certificate_key /etc/ssl/certs/tm_keys/private.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://fastapi_app;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Reuses the same domain/cert as the REST API above — just a
        # different path prefix, so no extra DNS record or certificate is
        # needed to expose this. server.py's MDSTACK_MCP_PATH defaults to
        # "/mcp" too, so this prefix has to keep matching that if either
        # one changes.
        location /mcp {
            proxy_pass http://mcp_app;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Authorization (the MDSTACK_MCP_TOKEN bearer check) isn't a
            # hop-by-hop header, so nginx forwards it to the upstream
            # untouched with no extra config needed here.

            # Streamable HTTP needs these three, which the plain REST
            # proxy above doesn't: nginx buffers a proxied response by
            # default (fine for a JSON reply, but it'd hold an entire SSE
            # stream in memory before ever forwarding a byte), keeps
            # sending "Connection: close" upstream unless told not to, and
            # kills an upstream connection that's been idle past the
            # default 60s — all three break a long-lived MCP session.
            proxy_buffering off;
            proxy_set_header Connection "";
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    } 
}
