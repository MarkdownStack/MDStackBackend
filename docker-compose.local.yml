# Local development only. docker-compose.yml as committed no longer runs a
# Postgres container at all — production points DATABASE_URL at a managed
# instance instead (AWS RDS — see .env.example) — so local dev's own
# Postgres container lives entirely here now.
#
# NAMED .local.yml, NOT .override.yml, AND THAT MATTERS. Compose
# auto-merges a file named exactly docker-compose.override.yml with no
# flags at all. This file IS committed, and deploy_ec2.yaml deploys by
# `git reset --hard origin/master` — so under the old name it landed on
# EC2 and the plain `docker compose up -d` there silently merged it,
# which meant production ran a local Postgres container, had its
# DATABASE_URL overridden away from RDS, published the API past nginx,
# and (with the workflow's --build) rebuilt the image on the box. The
# rename is the fix: Compose will not pick this up implicitly, so a bare
# `docker compose up` — which is what EC2 runs — sees only
# docker-compose.yml.
#
# Locally, name it explicitly:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d
# Or set COMPOSE_FILE in your own .env (gitignored, so it never reaches a
# deployed box) to get bare `docker compose up` back:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.local.yml
services:
  # Same image/credentials docker-compose.yml's `postgres` service used to
  # ship before the move to a managed instance — moved here rather than
  # deleted, so `docker compose up` still gives you a full local stack to
  # test against.
  postgres:
    image: postgres:16-alpine
    container_name: mdstack_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=mdstack
      - POSTGRES_PASSWORD=mdstack
      - POSTGRES_DB=mdstack
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network
    # Published to the host (unlike the old prod setup) so `uv run alembic`
    # / `uv run uvicorn` running directly on your machine (outside Docker)
    # can reach it at localhost:5432 too — matching backend/.env's
    # DATABASE_URL default in .env.example.
    ports:
      - "5432:5432"

  backend:
    # Build from the local Dockerfile instead of pulling the CI-built image
    # docker-compose.yml names. Compose merges this on top of that file's
    # `image:` line, so the locally-built result just gets tagged with that
    # same name. Production is unaffected only because this file is never
    # named on a deployed box's command line (see the header) — not because
    # of anything in the deploy workflow, which copies every tracked file.
    #
    # Why bother: local dev should run the code in your working tree, not
    # whatever CI last pushed to `latest` from master — and pulling that
    # image locally has its own failure mode (a stale or half-pulled copy
    # surfaces as `unable to find user appuser: no matching entries in
    # passwd file`, since the image config says USER appuser but the cached
    # layers don't carry the useradd from Dockerfile's runtime stage).
    # Building here sidesteps both.
    build:
      context: .
      dockerfile: Dockerfile
    # .env.local is loaded after .env (declared in docker-compose.yml's
    # env_file:) so its DATABASE_URL wins — pointing the containerized
    # backend at the postgres container over the compose network's own DNS
    # instead of localhost, which inside a container means itself.
    # Compose merges env_file lists when -f is used, in document order,
    # later entries winning on conflict — that's what makes this work.
    env_file:
      - ./.env
    depends_on:
      - postgres
    # Published to the host for the same reason as postgres above — hit it
    # directly at localhost:8000 while developing, without needing nginx
    # (which isn't part of this local stack at all) in front of it.
    # docker-compose.yml deliberately leaves this unpublished in production
    # (nginx is the only public entrypoint there), and that stays true so
    # long as this file is only ever passed explicitly with -f locally.
    ports:
      - "8000:8000"

volumes:
  pgdata:
